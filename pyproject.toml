[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-manuscript-skills"
version = "0.1.0"
description = "Evidence-centric biomedical research and manuscript workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Biomedical Manuscript Skills contributors" }]
dependencies = []
keywords = ["biomedical", "evidence-synthesis", "research-integrity", "manuscript"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
biomed = "biomedical_manuscript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/biomedical-manuscript-skills/guidelines" = ["guidelines/registry.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
