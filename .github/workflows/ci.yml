name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package and CLI
        run: python -m pip install -e .
      - name: Smoke-test installed CLI
        run: biomed --help
      - name: Run offline validation
        run: python scripts/validate.py
